[project]
name = "hikvision_access"
version = "0.1.0"
description = "Home Assistant integration for Hikvision access controllers via ISAPI alertStream."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-aiohttp>=1.0",
  "pytest-homeassistant-custom-component>=0.13",
  "aiohttp>=3.9",
  "ruff>=0.5",
  "mypy>=1.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "ASYNC", "PT", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["custom_components/hikvision_access/api"]
# Skip analyzing imports entirely — HA core uses PEP 696 type-parameter
# defaults (Python 3.13+ syntax) which mypy's parser rejects when the
# project's python_version is lower. We strict-check only the pure-Python
# api/ core; everything outside is left to runtime tests.
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest-homeassistant-custom-component aggressively asserts test isolation
# (no lingering threads, no lingering tasks, default-blocks sockets) which
# conflicts with our pure-aiohttp tests in tests/test_client.py and
# tests/test_http.py. HA-flavoured tests will live in tests/ha/ and run
# with `pytest tests/ha/` (which re-enables the plugin via its own conftest).
addopts = "-p no:homeassistant"
